version: "3.9"

services:
  server:
      build:
        context: .
        dockerfile: services/server/Dockerfile
      ports:
        - "8000:8000"
      healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\""]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 180s
      environment:
        - TEST_IMPORT=${TEST_IMPORT}
        - PROXY_API_KEY=${PROXY_API_KEY}
        - PROXY_BASE_URL=${PROXY_BASE_URL}
        - PROXY_MODEL=${PROXY_MODEL:-gpt-4o-mini}
        - EMBEDDING_MODELS_DIR=/data/embedding-models
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_HOST=${POSTGRES_HOST}
        - POSTGRES_PORT=${POSTGRES_PORT}
        - DATABASE_URL=${DATABASE_URL}
        - SPREADSHEET_ID=${SPREADSHEET_ID}
        - SERVICE_ACCOUNT_FILE=${SERVICE_ACCOUNT_FILE}
        - PAIRS_SPREADSHEET_ID=${PAIRS_SPREADSHEET_ID}
        - SERVER_URL=${SERVER_URL}
        - BOT_API_URL=${BOT_API_URL:-http://bot:5000}
        - GOOGLE_DATA_API_URL=${GOOGLE_DATA_API_URL:-http://google_data:8000}
        - MATCHING_API_URL=${MATCHING_API_URL:-http://matching:8000}
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
      volumes:
        - ./common:/app/common
        - ./templates:/app/templates
        - ./services:/app/services
      depends_on:
        - postgres
      restart: unless-stopped

  admin:
      build:
        context: .
        dockerfile: services/admin/Dockerfile
      ports:
        - "8001:8000"
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_HOST=${POSTGRES_HOST}
        - POSTGRES_PORT=${POSTGRES_PORT}
        - DATABASE_URL=${DATABASE_URL}
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
      volumes:
        - ./common:/app/common
        - ./templates:/app/templates
        - ./services:/app/services
      depends_on:
        - postgres
      restart: unless-stopped

  google_data:
      build:
        context: .
        dockerfile: services/google_data/Dockerfile
      ports:
        - "8002:8000"
      environment:
        - PROXY_API_KEY=${PROXY_API_KEY}
        - PROXY_BASE_URL=${PROXY_BASE_URL}
        - PROXY_MODEL=${PROXY_MODEL:-gpt-4o-mini}
        - EMBEDDING_MODELS_DIR=/data/embedding-models
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_HOST=${POSTGRES_HOST}
        - POSTGRES_PORT=${POSTGRES_PORT}
        - DATABASE_URL=${DATABASE_URL}
        - SPREADSHEET_ID=${SPREADSHEET_ID}
        - SERVICE_ACCOUNT_FILE=${SERVICE_ACCOUNT_FILE}
        - PAIRS_SPREADSHEET_ID=${PAIRS_SPREADSHEET_ID}
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
      volumes:
        - ./common:/app/common
        - ./templates:/app/templates
        - ./services:/app/services
      depends_on:
        - postgres
      restart: unless-stopped

  matching:
      build:
        context: .
        dockerfile: services/matching/Dockerfile
      ports:
        - "8003:8000"
      environment:
        - PROXY_API_KEY=${PROXY_API_KEY}
        - PROXY_BASE_URL=${PROXY_BASE_URL}
        - PROXY_MODEL=${PROXY_MODEL:-gpt-4o-mini}
        - EMBEDDING_MODELS_DIR=/data/embedding-models
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_HOST=${POSTGRES_HOST}
        - POSTGRES_PORT=${POSTGRES_PORT}
        - DATABASE_URL=${DATABASE_URL}
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
      volumes:
        - ./common:/app/common
        - ./templates:/app/templates
        - ./services:/app/services
      depends_on:
        - postgres
      restart: unless-stopped

  bot:
      build: ./bot
      ports:
        - 5000:5000
      environment:
        - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
        - SERVER_URL=http://server:8000
      volumes:
        - ./bot:/app/bot
        - ./templates:/app/templates:ro
      depends_on:
        server:
          condition: service_healthy
      restart: unless-stopped 

  postgres:
    image: ankane/pgvector
    container_name: mentormatch-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: mentormatch-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  pgdata:
  pgadmin_data:
